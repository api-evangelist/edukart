description: EduKart was an Indian online education startup, backed by 500 Startups (500 Global), that sold
  certificate, diploma and degree courses from partner universities and training institutes to Indian learners.
  It was surfaced as a portfolio company of 500-global and added to the API Evangelist network as a stub for
  enrichment. The company is now defunct — repeated probes of edukart.com find a parked hosting placeholder
  rather than a live business, and no developer, API, documentation or SDK surface exists to catalog.
